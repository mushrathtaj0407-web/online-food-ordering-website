<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodie - Online Food Ordering</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🍔 Foodie</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#menu">Food Menu</a>
            <a href="#cart">My Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <!-- Home -->
    <section id="home" class="hero">
        <h2>Delicious Food Delivered to You!</h2>
        <p>Order your favorite meals, snacks, and drinks.</p>
        <a href="#menu" class="btn">Explore Menu</a>
    </section>

    <!-- Menu -->
    <section id="menu" class="container">

        <h2>Our Food Menu 🍽️</h2>

        <!-- Search -->
        <input
            type="search"
            id="search"
            placeholder="Search for food..."
            aria-label="Search food items"
        >

        <!-- Categories -->
        <div class="categories">
            <button type="button" class="category-btn active"
                    data-category="All">All</button>

            <button type="button" class="category-btn"
                    data-category="Meals">Meals</button>

            <button type="button" class="category-btn"
                    data-category="Snacks">Snacks</button>

            <button type="button" class="category-btn"
                    data-category="Drinks">Drinks</button>
        </div>

        <!-- JavaScript displays food items here -->
        <div id="food-list" class="food-container"></div>

        <p id="no-results" hidden>No food items found.</p>

    </section>

    <!-- Cart -->
    <section id="cart" class="container">

        <h2>🛒 Shopping Cart</h2>

        <div id="cart-items">
            Your cart is empty.
        </div>

        <h3>Total: ₹<span id="total">0.00</span></h3>

        <button type="button" id="clear-cart" class="clear-btn">
            Clear Cart
        </button>

    </section>

    <!-- Checkout -->
    <section id="checkout" class="container">

        <h2>Delivery Details</h2>

        <form id="checkout-form">

            <label for="customer-name">Full Name</label>
            <input
                type="text"
                id="customer-name"
                required
                placeholder="Enter your name"
            >

            <label for="customer-phone">Mobile Number</label>
            <input
                type="tel"
                id="customer-phone"
                required
                pattern="[6-9][0-9]{9}"
                placeholder="Enter 10-digit mobile number"
            >

            <label for="customer-address">Delivery Address</label>
            <textarea
                id="customer-address"
                required
                placeholder="Enter delivery address"
            ></textarea>

            <button type="submit" id="place-order" disabled>
                Place Order
            </button>

        </form>

        <p id="message" role="status"></p>

        <div id="order-summary" hidden></div>

    </section>

    <footer>
        <p>© 2026 Foodie | Online Food Ordering Website</p>
    </footer>

</body>
      </html>
